services:
  backend:
    build: .
    container_name: intent-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://intent:intent_prod_password@postgres:5432/intent?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: 8080
      ENV: production
      CIRCLE_API_KEY: ${CIRCLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: intent-postgres-prod
    environment:
      POSTGRES_USER: intent
      POSTGRES_PASSWORD: intent_prod_password
      POSTGRES_DB: intent
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: intent-redis-prod
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
